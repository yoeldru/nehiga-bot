# נכתב: 2026-10-29 02:15 | עודכן: 2026-10-29 21:00 (מספר גרסה אוטומטי + הערות גרסה)
# בונה את האפליקציה בכל פעם שמעלים שינוי, ומפרסם קובץ APK להורדה.
# האפליקציה עצמה בודקת כאן אם יש גרסה חדשה (releases/latest).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Version
        run: |
          echo "VC=$((100 + ${{ github.run_number }}))" >> $GITHUB_ENV
          echo "VN=2.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build
        run: gradle assembleDebug --no-daemon -PvCode=$VC -PvName=$VN

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nehiga.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VC }}
          name: בוט נהיגה ${{ env.VN }}
          body: ${{ github.event.head_commit.message }}
          files: nehiga.apk
          make_latest: true
